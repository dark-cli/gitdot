[[mgr.prepend_keymap]]
on   = [ "o" ]
run  = "open --interactive"
desc = "Open with option menu"

[[mgr.prepend_keymap]]
on   = [ "O" ]
run  = "noop"
desc = "Disabled (use 'o' instead)"

[[mgr.prepend_keymap]]
on   = [ "Enter" ]
run  = "open"
desc = "Open with default opener"

[[mgr.prepend_keymap]]
on   = [ "w" ]
run  = "plugin what-size"
desc = "Calculate size of selection or current directory"
